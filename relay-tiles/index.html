<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#111823"><meta name="robots" content="noindex"><title>Relay Tiles • Playtest</title>
<style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:radial-gradient(ellipse at 50% 5%,#26344b 0,#111823 60%);color:#eff7ef;font:500 16px system-ui,sans-serif;min-height:100dvh}button,input{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #f2bd82;outline-offset:3px}button:disabled{cursor:default;opacity:.37}.shell{width:min(100%,506px);margin:auto;padding:12px clamp(12px,4vw,27px) 20px}header,.bar,.actions,.metrics,.hud,.tabs,.title-row,.history-row{display:flex;align-items:center;gap:8px}header,.bar,.hud,.title-row{justify-content:space-between}header{margin-bottom:24px}.wordmark{font-size:17px;font-weight:850;letter-spacing:-.04em;display:flex;gap:10px;align-items:center}.mark,.ico{width:21px;height:21px;vertical-align:middle;flex:none}.mark{color:#d5f689}.kicker{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#c9e08e;font-weight:800}h1{font-size:clamp(30px,9vw,51px);line-height:1;margin:7px 0 11px;letter-spacing:-.075em}.sub{font-size:13px;color:#b1bece;margin:0 0 15px;line-height:1.45}.tabs{margin:0 0 12px;gap:6px}.tabs button,.key,.mini,.history-row{border:1px solid #42536a;background:#202c3d;border-radius:12px;min-height:44px;padding:7px 10px}.tabs button{flex:1;min-width:0;white-space:nowrap;font-size:12px;font-weight:750;padding-inline:5px}.tabs button[aria-pressed=true]{background:#d5f689;color:#182921;border-color:#d5f689}.tabs .ico{width:16px;height:16px}.key{padding:8px;min-width:44px;display:inline-grid;place-items:center}.key[aria-pressed=true]{background:#d5f689;color:#182921}.panel{background:#182332;border:1px solid #39485e;padding:12px;border-radius:21px;box-shadow:0 16px 42px #070c1255}.hud{margin:0 0 11px;color:#aebdcb;font-size:12px;gap:5px;flex-wrap:wrap}.metric{font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:5px}.metric .ico{width:17px;height:17px}.metric strong{color:#e7f4e8}.board{display:grid;gap:clamp(3px,1.25vw,6px);padding:6px;border-radius:13px;background:#0f1724;touch-action:manipulation}.tile{background:#29374a;border:1px solid #35455b;border-radius:clamp(6px,2vw,10px);aspect-ratio:1;min-width:0;padding:0;position:relative;color:#8198b0;display:grid;place-items:center}.tile.warm{background:#33463e;border-color:#596e58;color:#d5f689}.tile svg{width:100%;height:100%;display:block;overflow:visible}.tile .bad{fill:#ffb487;stroke:#17242d;stroke-width:1}.tile:active{filter:brightness(1.3)}.tile.hint{outline:2px dashed #f5bb8b;outline-offset:-4px}.under{min-height:39px;display:flex;align-items:center;font-size:12px;color:#becada;gap:7px}.under .ico{width:16px;height:16px;color:#ffc69c}.actions{flex-wrap:wrap}.go{background:#d5f689;color:#192622;border:1px solid #d5f689;border-radius:12px;min-height:44px;font-weight:800;padding:8px 13px;flex:1;min-width:max-content}.modal-layer{background:#080f1bdd;position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:14px}.modal-layer[hidden], [hidden]{display:none!important}.dialog{width:min(100%,410px);padding:17px;border:1px solid #4c5e70;background:#1c2839;border-radius:18px;max-height:84dvh;overflow:auto}h2{font-size:22px;letter-spacing:-.04em;margin:0}.dialog p{font-size:13px;color:#c9d3df;line-height:1.5}.history-row{width:100%;text-align:left;justify-content:space-between;margin:7px 0;font-size:13px}.dialog input{width:100%;margin:5px 0 9px;background:#121c2a;border:1px solid #4c5e70;border-radius:10px;padding:10px}.swatches{display:flex;justify-content:center;gap:13px;align-items:center;color:#d5f689;margin:14px}.swatches .ico{width:32px;height:32px}.foot{text-align:center;color:#aebdcb;font-size:11px;margin:14px 0 0}.detail{color:#aebdcb}.done .under{color:#d5f689}#hintText{overflow-wrap:anywhere} @media(max-width:370px){header{margin-bottom:19px}.panel{padding:9px}.tabs button{font-size:11px}.shell{padding-inline:12px}} @media(prefers-reduced-motion:no-preference){.tile{transition:background .15s,color .15s}.tile svg{animation:arrive .12s ease-out}@keyframes arrive{from{opacity:.75}to{opacity:1}}}
</style></head><body>
<div id="app" class="shell"><header><div class="wordmark"><span id="logo"></span>Relay Tiles</div><button type="button" id="help" class="key" aria-label="How to play"></button></header>
<main><div class="kicker" id="kicker">01 / 06</div><h1 id="headline">Make it glow.</h1><p class="sub">Tap a tile to turn it. Light the whole board.</p>
<nav class="tabs" aria-label="Play modes"><button id="trail"></button><button id="daily"></button><button id="log"></button></nav>
<section class="panel" id="panel" aria-label="Puzzle"><div class="hud"><span class="metric" id="lit"></span><span class="metric" id="moves"></span><span class="metric" id="level"></span></div><div class="board" id="board"></div>
<div class="under" id="status" role="status"></div>
<div class="actions"><button class="key" id="undo" aria-label="Undo one move"></button><button class="key" id="hint" aria-label="Toggle hint" aria-pressed="false"></button><button class="key" id="share" aria-label="Share or open a challenge"></button><button class="go" id="next" hidden>Next puzzle</button></div></section>
</main><p class="foot">Playtest 01 · No account · Progress stays on this browser</p></div>
<div class="modal-layer" id="layer" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="title-row"><h2 id="dialog-title"></h2><button id="close" class="key" aria-label="Close"></button></div><div id="dialog-body"></div></div></div>
<script>
(()=>{'use strict';
const P={bolt:'<path d="M13 2 4 14h7l-1 8 10-13h-7z"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9 10a3 3 0 0 1 6 0c0 2-3 2-3 4m0 3h.01"/>',trail:'<path d="M3 19V7h6v5h6V5h6"/>',daily:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4m8-4v4"/>',log:'<path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2zm0 14h14M9 8h6m-6 4h4"/>',undo:'<path d="M8 5l-5 5 5 5m-5-5h11a5 5 0 0 1 0 10h-2"/>',hint:'<path d="M8 15c0-2-2-2-2-6a6 6 0 0 1 12 0c0 4-2 4-2 6m-8 2h8m-7 4h6"/>',share:'<circle cx="6" cy="12" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="m8 11 8-4m-8 6 8 4"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',arrow:'<path d="M3 12h17m-7-7 7 7-7 7"/>',warning:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 4h.01"/>',check:'<path d="m5 12 5 5L20 7"/>'};
const ico=(id,cl='ico')=>'<svg class="'+cl+'" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+P[id]+'</svg>';
const $=s=>document.getElementById(s), key='relay-tiles-playtest-v1', sizes=[3,4,4,5,5,6]; 
const dbl=x=>(x<<1&15)|(x>>>3), rot=(x,k)=>{for(let i=0;i<k;i++)x=dbl(x);return x};
const stamp=()=>new Date().toISOString().slice(0,10).replaceAll('-','');
const isDaily=s=>/^20\d{6}$/.test(s)&&+s.slice(4,6)>=1&&+s.slice(4,6)<=12&&+s.slice(6)<=31&&+s.slice(6)>=1;
const valid=s=>typeof s==='string'&&(/^[1-6]$/.test(s)||isDaily(s));
const safe=s=>valid(s)?s:'1';
let data={id:'1',lastTrail:'1',states:{}}; let memoryOnly=false;
try {const d=JSON.parse(localStorage.getItem(key)); if(d&&d.states&&typeof d.states==='object'){data.states=d.states;data.id=safe(d.id);data.lastTrail=/^[1-6]$/.test(d.lastTrail)?d.lastTrail:'1'}}catch{}
const inbound=new URLSearchParams(location.search).get('p'); if(valid(inbound)){data.id=inbound;if(inbound.length===1)data.lastTrail=inbound}
let id=data.id, n, origin, solved=[], s, hint=false, lastFocus=null;
function save(){data.id=id;try{localStorage.setItem(key,JSON.stringify(data))}catch(e){memoryOnly=true;document.querySelector('.foot').textContent='Temporary session · This browser blocked local saving'}}
function rng(seed){let x=seed>>>0; return ()=>{x=(Math.imul(1664525,x)+1013904223)>>>0;return x/4294967296}}
const dirs=[[-1,0],[0,1],[1,0],[0,-1]];
function neighbor(i,d){let r=Math.floor(i/n)+dirs[d][0],c=i%n+dirs[d][1];return r>=0&&r<n&&c>=0&&c<n?r*n+c:-1}
function graph(m){let live=new Set([origin]),q=[origin],bad=[];while(q.length){const i=q.pop();for(let d=0;d<4;d++){if(!(m[i]&(1<<d)))continue;const j=neighbor(i,d);if(j>=0&&(m[j]&(1<<((d+2)%4)))){if(!live.has(j)){live.add(j);q.push(j)}}else bad.push([i,d])}}return {live,bad,won:live.size===n*n&&bad.length===0}}
function setup(code){id=safe(code);if(id.length===1)data.lastTrail=id; n=id.length===1?sizes[+id-1]:5;origin=Math.floor(n*n/2);const r=rng(0x9e3779b9^Math.imul(+id,2654435761));solved=Array(n*n).fill(0);const seen=new Set([origin]), stack=[origin];
while(stack.length){let i=stack.at(-1),choices=[];for(let d=0;d<4;d++){const j=neighbor(i,d);if(j>=0&&!seen.has(j))choices.push([d,j])}if(!choices.length){stack.pop();continue}const [d,j]=choices[Math.floor(r()*choices.length)];solved[i]|=1<<d;solved[j]|=1<<((d+2)%4);seen.add(j);stack.push(j)}
const first=id==='1';const start=solved.map((m,i)=>rot(m,first?([origin,1,8].includes(i)?1:0):Math.floor(r()*4))); if(graph(start).won)start[origin]=dbl(start[origin]);
let old=data.states[id]; if(!old||!Array.isArray(old.m)||old.m.length!==n*n||!old.m.every((m,i)=>Number.isInteger(m)&&[0,1,2,3].some(k=>m===rot(solved[i],k)))||!Array.isArray(old.undo)||!Number.isInteger(old.moves)||old.moves<0){old={m:start,undo:[],moves:0,best:null}}
data.states[id]=s=old;hint=false;save();render(true);
}
function drawing(mask,isOrigin,breaks){const pts=[[12,0],[24,12],[12,24],[0,12]];return '<svg viewBox="0 0 24 24" aria-hidden="true">'+pts.map(([x,y],d)=>(mask&(1<<d)?'<path d="M12 12L'+x+' '+y+'" stroke="currentColor" stroke-width="2.7" stroke-linecap="round"/>':'' )).join('')+'<circle cx="12" cy="12" r="'+(isOrigin?'5':'2.6')+'" fill="currentColor"/>'+(isOrigin?'<path d="m12.5 8.9-2.7 3.5h2.1l-.4 2.8 3-3.7h-2.1z" fill="#1a242f"/>':'')+breaks.map(d=>{const [x,y]=[[12,2.1],[21.9,12],[12,21.9],[2.1,12]][d];return '<circle class="bad" cx="'+x+'" cy="'+y+'" r="1.8"/>'}).join('')+'</svg>'}
let sizeRendered=0;
function render(rebuild=false){const g=graph(s.m), board=$('board');if(rebuild||sizeRendered!==n){sizeRendered=n;board.style.gridTemplateColumns='repeat('+n+',minmax(0,1fr))';board.replaceChildren(...s.m.map((_,i)=>{const b=document.createElement('button');b.type='button';b.className='tile';b.onclick=()=>tap(i);return b}))}
const hinted=hint?s.m.findIndex((m,i)=>m!==solved[i]&&g.live.has(i)):-1;const target=hint&&hinted<0?s.m.findIndex((m,i)=>m!==solved[i]):hinted;
[...board.children].forEach((b,i)=>{b.classList.toggle('warm',g.live.has(i));b.classList.toggle('hint',target===i&&!g.won);b.setAttribute('aria-label','Turn tile '+(Math.floor(i/n)+1)+', '+(i%n+1)+(i===origin?' (power source)':'')+(g.live.has(i)?', lit':', unlit'));b.innerHTML=drawing(s.m[i],i===origin,g.bad.filter(x=>x[0]===i).map(x=>x[1]))});
$('trail').setAttribute('aria-pressed',String(id.length===1));$('daily').setAttribute('aria-pressed',String(id.length>1));
$('kicker').textContent=id.length===1?'Trail / '+id.padStart(2,'0'):'Daily / '+id.slice(4,6)+'.'+id.slice(6);
$('headline').textContent=g.won?'All lit.':'Make it glow.';$('panel').classList.toggle('done',g.won);
$('lit').innerHTML=ico('bolt')+'<strong>'+g.live.size+' / '+n*n+'</strong>';
$('moves').innerHTML=ico('undo')+'<strong>'+s.moves+'</strong><span>Turns</span>';
$('level').textContent=n+' × '+n;
$('status').innerHTML=g.won?ico('check')+'<span>Connected. Best: '+s.best+' turns.</span>':ico('warning')+'<span id="hintText">'+(hint?'Turn the outlined tile.':'Amber dots mark open ends.')+'</span>';
$('undo').disabled=s.undo.length===0;$('hint').disabled=g.won;$('hint').setAttribute('aria-pressed',String(hint));$('next').hidden=!g.won;$('next').textContent=id.length===1&&+id<6?'Next puzzle':id.length===1?'Daily puzzle':'Back to trail';}
function tap(i){if(graph(s.m).won)return;const next=dbl(s.m[i]);if(next===s.m[i])return;s.undo.push([i,s.m[i]]);s.m[i]=next;s.moves++;if(graph(s.m).won){if(s.best===null||s.moves<s.best)s.best=s.moves;hint=false}save();render()}
function undo(){let prev=s.undo.pop();if(!prev)return;s.m[prev[0]]=prev[1];s.moves=Math.max(0,s.moves-1);save();render()}
function close(restore=true){if($('layer').hidden)return;$('layer').hidden=true;$('app').inert=false;if(restore&&lastFocus)lastFocus.focus()}
function modal(title){if($('layer').hidden)lastFocus=document.activeElement;$('dialog-title').textContent=title;$('dialog-body').replaceChildren();$('layer').hidden=false;$('app').inert=true;$('close').focus();return $('dialog-body')}
function button(label,clazz,fn){let b=document.createElement('button');b.type='button';b.className=clazz;b.textContent=label;b.onclick=fn;return b}
function p(msg){const e=document.createElement('p');e.textContent=msg;return e}
function nav(code){close(false);setup(code);$('board').firstElementChild.focus({preventScroll:true})}
function journal(){const d=modal('Your puzzles');const trail=sizes.map((_,i)=>String(i+1));const ds=Object.keys(data.states).filter(isDaily).sort().reverse();for(const c of [...trail,...ds]){const row=button('','history-row',()=>nav(c)),name=document.createElement('span'),score=document.createElement('span'),rec=data.states[c];name.textContent=c.length===1?'Trail '+c+' · '+sizes[+c-1]+'×'+sizes[+c-1]:'Daily '+c.slice(0,4)+'-'+c.slice(4,6)+'-'+c.slice(6);score.className='detail';score.textContent=rec?.best!=null?'★ '+rec.best:rec?.moves?rec.moves+' turns':'—';row.append(name,score);d.append(row)}}
function share(){const d=modal('Pass this puzzle'); const online=/^https?:$/.test(location.protocol)&&!['localhost','127.0.0.1'].includes(location.hostname), u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('p',id);const score=s.best!=null?' · '+s.best+' turns':'';
const code='RT-'+id, message='Relay Tiles'+score+'\n'+(online?u.href:code);const i=document.createElement('input');i.readOnly=true;i.value=online?u.href:code;i.setAttribute('aria-label','Challenge link or code');let feedback=p(online?'Same board. No solution revealed.':'Open this prototype and enter the code below on the other device.');feedback.setAttribute('role','status');d.append(feedback,i,button('Copy challenge','mini',async()=>{try{await navigator.clipboard.writeText(message);feedback.textContent='Copied.'}catch{i.select();feedback.textContent='Selection ready. Copy it from this field.'}}));
const join=document.createElement('input');join.placeholder='RT-1';join.autocomplete='off';join.setAttribute('aria-label','Paste a challenge code');d.append(p('Open a challenge'),join,button('Open','mini',()=>{const token=join.value.trim().toUpperCase().replace(/^RT-/,'');if(valid(token))nav(token);else feedback.textContent='Use a code like RT-1 or RT-20261118.'}));}
$('logo').innerHTML=ico('bolt','mark');for(const [a,b] of [['help','help'],['undo','undo'],['hint','hint'],['share','share'],['close','close']])$(a).innerHTML=ico(b);
for(const [a,b,c] of [['trail','trail','Trail'],['daily','daily','Daily'],['log','log','History']])$(a).innerHTML=ico(b)+' '+c;
$('trail').onclick=()=>nav(data.lastTrail);$('daily').onclick=()=>nav(stamp());$('log').onclick=journal;
$('undo').onclick=undo;$('hint').onclick=()=>{hint=!hint;render()};$('share').onclick=share;$('next').onclick=()=>nav(id.length===1?(+id<6?String(+id+1):stamp()):data.lastTrail);
$('help').onclick=()=>{const e=modal('How it works');let scene=document.createElement('div');scene.className='swatches';scene.innerHTML=drawing(1,true,[0])+ico('arrow')+drawing(2,true,[]);scene.querySelectorAll('svg:not(.ico)').forEach(x=>x.style.width='40px');e.append(scene,p('Tap any tile to turn it a quarter turn. Match both ends of each line. Amber dots show where a lit wire has no matching neighbor.'),p('The bolt is your power source. Connect all tiles with no open ends. Undo steps back one turn. The bulb toggles an outline on or off.'),button('Play','go',()=>close()))};
$('close').onclick=()=>close();$('layer').onclick=e=>{if(e.target===$('layer'))close()};
document.addEventListener('keydown',e=>{if($('layer').hidden)return;if(e.key==='Escape'){e.preventDefault();close()}if(e.key==='Tab'){let f=[...$('layer').querySelectorAll('button,input')],i=f.indexOf(document.activeElement);if(e.shiftKey&&i===0){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}});
setup(id);
})();
</script></body></html>
