<!doctype html>

    <style>
      html, body { background: #0f1830; margin: 0; overscroll-behavior: none; }
      .x-game { --bs: min(calc(100vw - 64px), calc(100vh - 214px), 540px); --bs: min(calc(100vw - 64px), calc(100dvh - 214px), 540px); position: fixed; inset: 0; background: #0f1830; color: #f3f5fb; font-family: var(--sans); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: max(10px, env(safe-area-inset-top)) 10px max(12px, env(safe-area-inset-bottom)); box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; overflow: hidden; z-index: 10; }
      .x-top { width: 100%; max-width: 560px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }

      .x-board { display: grid; grid-template-columns: 20px var(--bs) 20px; grid-template-rows: var(--bs) 20px auto; }
      .x-under { grid-column: 2; grid-row: 3; display: flex; align-items: center; gap: 8px; padding-top: 8px; }
      .x-xt { height: var(--tap); min-width: 64px; padding: 0 16px; border-radius: var(--r-pill); border: 1.5px solid #4a5578; background: transparent; color: #8a93ad; font: var(--type-body); font-size: 20px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: background var(--dur-quick), border-color var(--dur-quick), color var(--dur-quick), transform var(--dur-quick) var(--ease-out); }
      .x-xt:active { transform: scale(.92); }
      .x-xt:focus-visible { outline: 2px solid #ffd36e; outline-offset: 2px; }
      .x-xt.on { background: #ffd36e; border-color: #ffd36e; color: #0f1830; }
      .x-xt--mini { height: 30px; min-width: 44px; padding: 0 10px; font-size: 16px; vertical-align: middle; cursor: default; }
      .x-mode { height: var(--tap); padding: 0 14px; color: inherit; cursor: pointer; border-radius: var(--r-pill); background: #1d2a4d; border: 1.5px solid #ffd36e; font-size: 20px; display: inline-flex; align-items: center; transition: opacity var(--dur-quick), filter var(--dur-quick), border-color var(--dur-quick); }
      .x-mode.off { opacity: .35; filter: grayscale(1); border-color: #34436e; }
      .x-grid { --n: 7; grid-column: 2; grid-row: 1; box-sizing: border-box; width: var(--bs); height: var(--bs); display: grid; grid-template-columns: repeat(var(--n), 1fr); grid-template-rows: repeat(var(--n), 1fr); background: #0b1226; border: 3px solid #0b1226; border-radius: var(--r-m); overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
      .x-rdots, .x-cdots { display: flex; box-sizing: border-box; }

      [data-k="4"] { --tile: #F5CF4B; } [data-k="5"] { --tile: #FF8DBA; } [data-k="6"] { --tile: #36BFB5; }
      [data-k="7"] { --tile: #FF9F45; } [data-k="8"] { --tile: #B7A8CC; }

      .x-cell.shake .x-in, .x-mc.shake .x-in { animation: x-shake .4s ease-in-out; }

      .x-tx { position: absolute; top: 4px; right: 4px; width: var(--tap); height: var(--tap); border: 0; background: transparent; color: inherit; opacity: .6; font-size: 18px; border-radius: var(--r-pill); cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 5; }
      .x-tx:focus-visible { outline: 2px solid currentColor; }
      .x-ri { width: 24px; height: 24px; }
      .x-row .x-btn.x-tn { font: var(--type-body); font-size: 17px; font-weight: var(--weight-bold); padding: 0 24px; }
      .x-cell.x-hz { z-index: 1; box-shadow: inset 0 0 0 3px rgba(255,240,190,.95), inset 0 0 14px rgba(255,220,120,.7); }
      .x-clay .x-cell.x-hz { box-shadow: none; filter: drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 5px rgba(242,160,123,.95)); }
      .x-after { display: none; flex: 1; justify-content: center; gap: 10px; }
      .x-under.fin > :not(.x-after) { display: none; }
      .x-under.fin .x-after { display: flex; }
      .x-after .x-btn { font: var(--type-label); font-weight: var(--weight-bold); padding: 0 18px; white-space: nowrap; }
      .x-tstage { position: relative; width: 224px; height: 224px; margin: 18px auto 6px; }
      .x-mini { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); width: 100%; height: 100%; box-sizing: border-box; border: 3px solid #0b1226; background: #0b1226; border-radius: 12px; overflow: hidden; }
      .x-mc { position: relative; display: flex; align-items: center; justify-content: center; box-sizing: border-box; border: 0 solid #0b1226; font-size: 26px; line-height: 1; color: #1c2547; background-color: var(--tile); }
      .x-mc.mark .x-in { color: rgba(20,28,56,.72); font-size: 18px; font-weight: 700; }

      @keyframes x-gtap { 45% { transform: translate(-30%, -10%) scale(1.14, .78); } 75% { transform: translate(-30%, -10%) scale(.94, 1.06); } }
      .x-ghost { filter: drop-shadow(0 3px 4px rgba(0,0,0,.35)); transform-origin: 50% 90%; }
      .x-ghost svg { display: block; }
      /* win sheet */
      #win .x-sheet { position: relative; padding-top: 26px; }
      #win .x-wclose { position: absolute; top: 10px; right: 10px; width: var(--tap); min-width: var(--tap); padding: 0; border-radius: var(--r-pill); font-size: 16px; margin: 0; }
      .x-wani { display: block; width: 96px; height: 96px; margin: 0 auto 6px; background: center / contain no-repeat; filter: drop-shadow(0 6px 10px rgba(91,70,54,.25)); animation: x-whop 1.1s cubic-bezier(.3,1.5,.5,1) .15s both, x-wbob 1.6s ease-in-out 1.3s infinite; }
      @keyframes x-whop { 0% { transform: scale(.4) translateY(20px); opacity: 0; } 55% { transform: scale(1.06, .94) translateY(-10px); opacity: 1; } 80% { transform: scale(.97, 1.03); } }
      @keyframes x-wbob { 0%, 100% { transform: translateY(0) scale(1); } 30% { transform: translateY(-7px) scale(.98, 1.02); } 55% { transform: translateY(0) scale(1.04, .96); } 70% { transform: scale(1); } }
      .x-wstars { display: flex; justify-content: center; align-items: center; gap: 6px; min-height: 44px; }
      .x-wstars svg { width: 40px; height: 40px; animation: x-wstar .5s cubic-bezier(.3,1.7,.5,1) both; animation-delay: calc(.45s + var(--i) * .22s); }
      .x-wstars .x-x2 { font: 600 15px var(--sans); color: #ffd36e; margin-left: 4px; animation: x-wstar .5s ease-out 1.2s both; }
      @keyframes x-wstar { from { transform: scale(0) rotate(-30deg); opacity: 0; } 70% { transform: scale(1.18) rotate(6deg); opacity: 1; } }

      .x-fx { grid-column: 2; grid-row: 1; position: relative; z-index: 3; margin: 3px; width: calc(var(--bs) - 6px); height: calc(var(--bs) - 6px); pointer-events: none; overflow: visible; }
      .x-fx--mini { position: absolute; left: 3px; top: 3px; margin: 0; width: calc(100% - 6px); height: calc(100% - 6px); }
      .x-beam { stroke: #ff3b4a; stroke-width: 3; stroke-linecap: round; vector-effect: non-scaling-stroke; animation: x-beam .8s ease-out forwards; }
      @keyframes x-beam { 0% { opacity: 0; } 12% { opacity: 1; } 65% { opacity: 1; } to { opacity: 0; } }
      .x-tier.bounce { animation: x-bounce .5s var(--ease-out); z-index: 2; }

      .x-stars { font-family: "Geist Mono", monospace; font-size: 16px; }

      .x-lgrid { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: min(80vw, 360px); max-height: min(52vh, 380px); overflow-y: auto; overscroll-behavior: contain; padding: 6px; margin: 0 0 16px; box-sizing: border-box; }

    <script src="hark.js"></script>
    <script>
      (function () { // one CSS variable per image: --img-tile, --img-4 … --img-9
        var root = document.documentElement;
        [].forEach.call(document.querySelectorAll("#clayImgs img"), function (im) {
          root.style.setProperty("--img-" + im.getAttribute("data-v"), 'url("' + im.src + '")');
        });
      })();
      (function () {
        var COLORS = ["#F28B6B", "#6FD3A8", "#A98BE8", "#6FB6EE", "#F3D15E", "#F39BB8", "#4FB8B0", "#F7A84E", "#B9A9C9"]; // confetti; tiles take their palette from CSS by data-k
        var $ = function (id) { return document.getElementById(id); };
        function rng(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
        function shuffle(a, R) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(R() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
        function range(n) { var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }

        // Random cat placement: one per row/col, no touching
        function place(N, R) {
          var cols = [], used = [];
          (function bt(r) {
            if (r === N) return true;
            var o = shuffle(range(N), R);
            for (var k = 0; k < N; k++) {
              var c = o[k];
              if (used[c] || (r && Math.abs(cols[r - 1] - c) < 2)) continue;
              used[c] = 1; cols[r] = c;
              if (bt(r + 1)) return true;
              used[c] = 0;
            }
            return false;
          })(0);
          return cols;
        }
        // Grow regions from cat cells by random flood fill
        function grow(N, cols, R) {
          var g = new Array(N * N).fill(-1), left = N * N - N;
          cols.forEach(function (c, r) { g[r * N + c] = r; });
          while (left) {
            var i = Math.floor(R() * N * N);
            if (g[i] >= 0) continue;
            var r = Math.floor(i / N), c = i % N, nb = [];
            if (r > 0 && g[i - N] >= 0) nb.push(g[i - N]);
            if (r < N - 1 && g[i + N] >= 0) nb.push(g[i + N]);
            if (c > 0 && g[i - 1] >= 0) nb.push(g[i - 1]);

          $("hLv").textContent = P.tier + "×" + P.tier + " · " + P.lv[P.tier] + "단계";
          $("hStars").textContent = "⭐ " + P.stars.toLocaleString();
          $("hAni").innerHTML = ani(P.tier);
        }
        function showHome() {
          drawHome(); homeOn = true; hideToast();
          $("win").classList.remove("show"); $("home").classList.add("show"); blip(520, 0.06);
        }
        function hideHome() { homeOn = false; $("home").classList.remove("show"); }
        function openDaily(ds) { // today, or a past date's seeded 6×6
          var g = dGames[ds];
          games.daily = g && !(g.done && ds !== dateStr) ? g : null;
          dKey = ds; $("cal").classList.remove("show"); hideHome();
          mode = null; setMode("daily"); dGames[ds] = games.daily;
        }
        $("homeB").onclick = showHome;
        $("hDaily").onclick = function () { openDaily(dateStr); };
        $("hLevel").onclick = openTiers;
        var calY, calM;
        function drawCal() {
          $("calT").textContent = calY + "년 " + (calM + 1) + "월";
          var first = new Date(calY, calM, 1).getDay(), last = new Date(calY, calM + 1, 0).getDate();
          var h = "일월화수목금토".split("").map(function (w) { return '<span aria-hidden="true">' + w + "</span>"; }).join("");
          for (var i = 0; i < first; i++) h += "<i></i>";
          for (var d = 1; d <= last; d++) {
            var ds = calY + "-" + pad(calM + 1) + "-" + pad(d), r = P.days[ds], td = ds === dateStr, st = r ? (r.stars ? "⭐" + r.stars : "✓") : "";
            h += '<button class="x-cd' + (td ? " today" : "") + (r ? " won" : "") + '" data-d="' + ds + '"' + (ds > dateStr ? " disabled" : "") +
              ' aria-label="' + (calM + 1) + "월 " + d + "일" + (td ? ", 오늘" : "") + (r ? ", 완료 " + st : "") + '">' + d + (r ? "<small>" + st + "</small>" : "") + "</button>";
          }
          $("calG").innerHTML = h;
          $("calN").disabled = calY > now.getFullYear() || (calY === now.getFullYear() && calM >= now.getMonth());
        }
        function calMove(k) { calM += k; if (calM < 0) { calM = 11; calY--; } if (calM > 11) { calM = 0; calY++; } blip(600, 0.04); drawCal(); }
        $("hPast").onclick = function () { calY = now.getFullYear(); calM = now.getMonth(); drawCal(); $("cal").classList.add("show"); blip(600, 0.05); };
        $("calP").onclick = function () { calMove(-1); };
        $("calN").onclick = function () { if (!this.disabled) calMove(1); };
        $("calX").onclick = function () { $("cal").classList.remove("show"); };
        $("cal").onclick = function (e) { if (e.target === this) $("calX").onclick(); };
        $("calG").onclick = function (e) {
          var b = e.target.closest(".x-cd"); if (!b || b.disabled) return;
          blip(700, 0.06); openDaily(b.dataset.d);
        };
        $("mute").onclick = function () { muted = !muted; this.innerHTML = ic(muted ? "snd-off" : "snd"); };

        // ---- Theme: Clay (default) or the original dark ----
        function setTheme(clay) {
          document.documentElement.classList.toggle("x-clay", clay);
          $("theme").setAttribute("aria-pressed", clay ? "true" : "false");
          try { localStorage.setItem("dg-theme", clay ? "clay" : "dark"); } catch (e) {}
          if (MB) clearLine(MB);
          later2(ensureScreen); setTimeout(ensureScreen, 300);
        }
        var th0 = "clay"; try { th0 = localStorage.getItem("dg-theme") || "clay"; } catch (e) {}
        setTheme(th0 !== "dark");
        $("theme").onclick = function () { setTheme(!document.documentElement.classList.contains("x-clay")); blip(560, 0.05); };

        drawStars();

        // ---- Tutorial: interactive 4x4, ghost hand shows each rule's wrong move, then the right cell ----
        var TG = [0, 0, 1, 1, 0, 2, 1, 1, 2, 2, 3, 1, 2, 3, 3, 3], TSOL = [1, 7, 8, 14];
        var DEMO = [
          { ic: ic("right") + " 1🐱", pre: [1], bad: 3, ok: 7 },      // row
          { ic: ic("down") + " 1🐱", pre: [1, 7], bad: 9, ok: 8 },   // column
          { ic: ic("theme") + " 1🐱", pre: [12], bad: 5, ok: 6 },     // colour region
          { ic: ic("diag") + " " + ic("no"), pre: [1], bad: 6, ok: 7 } // touching, incl. diagonal
        ];
        var NSTEP = DEMO.length + 1, mini = $("mini"), mcells = [], tStep = 0, tTok = 0, tCats = [], tSolved = false, ghost = $("ghost");
        for (var mi = 0; mi < 16; mi++) {
          var mc = document.createElement("button"); mc.className = "x-mc";
          edges(mc, mi, 4, TG); mc._c = null; inner(mc, "");
          mc.setAttribute("aria-label", "r" + ((mi >> 2) + 1) + "c" + ((mi & 3) + 1));
          mc.onclick = tTap.bind(null, mi);
          mini.appendChild(mc); mcells.push(mc);
        }
        var TB = { svg: $("tfx"), cells: mcells, N: 4, g: TG };
        function setRes(t) { $("tRes").innerHTML = t.split("🐱").join(ani(4)); } // the tutorial's cat is clay_cat in Clay
        function later(ms, tok, fn) { setTimeout(function () { if (tok === tTok) fn(); }, ms); }
        function ghostTo(i) { ghost.classList.remove("hover"); ghost.style.left = i < 0 ? "105%" : ((i & 3) + 0.5) * 25 + "%"; ghost.style.top = i < 0 ? "105%" : ((i >> 2) + 0.5) * 25 + "%"; }
        function tBad() { var b = {}; tCats.forEach(function (a) { tCats.forEach(function (c) { if (a !== c && blocks(4, TG, a, c)) b[a] = 1; }); }); return b; }
        function tPaint(changed) {
          var bad = tBad();
          mcells.forEach(function (el, i) {
            var cat = tCats.indexOf(i) >= 0, want = cat ? "🐱" : "";
            if (el._c.textContent !== want || i === changed) inner(el, want);
            el.classList.toggle("bad", !!bad[i]);
          });
          return bad;
        }
        function tSet(i, on) {
          if (on) { tCats.push(i); tPaint(i); fxPlace(TB, i, tCats); blip(660, 0.06); }
          else { tCats = tCats.filter(function (c) { return c !== i; }); clearLine(TB); tPaint(); blip(330, 0.06); }
        }
        function demo() {
          var d = DEMO[tStep], tok = ++tTok, res = $("tRes");
          tCats = d.pre.slice(); tPaint(); setRes(d.ic); ghostTo(-1);
          later(500, tok, function () { ghostTo(d.bad);
            later(800, tok, function () { flick(ghost, "tap", 360); tSet(d.bad, 1); setRes(d.ic + " " + ic("close"));
              later(1700, tok, function () { flick(ghost, "tap", 360); tSet(d.bad, 0);
                later(300, tok, function () { ghostTo(d.ok);
                  later(800, tok, function () { flick(ghost, "tap", 360); tSet(d.ok, 1); setRes(d.ic + " " + ic("ok"));
                    later(2200, tok, demo); }); }); }); }); });
        }
        function guide() { // guided play: after a pause the hand points at a cat to remove, or the next right cell
          var tok = ++tTok; ghostTo(-1);
          setRes("👉 🐱 " + tCats.length + " / 4");
          later(2500, tok, function () {
            var wrong = tCats.filter(function (c) { return TSOL.indexOf(c) < 0; });
            ghostTo(wrong.length ? wrong[0] : TSOL.filter(function (c) { return tCats.indexOf(c) < 0; })[0]);
            later(650, tok, function () { ghost.classList.add("hover"); });
          });
        }
        function tTap(i) {
          if (tStep !== DEMO.length || tSolved) return;
          tSet(i, tCats.indexOf(i) < 0);
          if (tCats.length === 4 && !Object.keys(tBad()).length) {
            tSolved = true; ++tTok; ghostTo(-1); chord();
            mcells.forEach(function (el) { el.disabled = true; });
            mcells.forEach(function (el, j) { el.style.animationDelay = ((j >> 2) + (j & 3)) * 45 + "ms"; flick(el, "bloom", 900); });
            $("tRes").textContent = "🎉 4 / 4"; $("tNext").classList.add("go");
          } else guide();
        }
        function tShow(s) {
          tStep = s; tSolved = false; $("tNext").classList.remove("go");
          mcells.forEach(function (el) { el.style.animationDelay = ""; el.disabled = s !== DEMO.length; });
          $("tDots").innerHTML = range(NSTEP).map(function (i) { return "<b" + (i === s ? ' class="on"' : "") + "></b>"; }).join("");
          var end = s === NSTEP - 1;
          $("tNext").textContent = end ? "시작" : "다음";
          if (end) { tCats = []; tPaint(); guide(); } else demo();
        }
        function openTut() { $("tut").classList.add("show"); tShow(0); }
        function closeTut() {
          ++tTok; $("tut").classList.remove("show");
          try { localStorage.setItem("dg-tut", "1"); } catch (e) {}
        }
        $("tNext").onclick = function () { if (tStep < NSTEP - 1) { blip(700, 0.06); tShow(tStep + 1); } else { blip(880, 0.08); closeTut(); } };
        $("tAgain").onclick = function () { blip(600, 0.05); tShow(tStep); };
        $("tX").onclick = function () { blip(500, 0.05); closeTut(); };
        $("help").onclick = openTut;

        mode = null; setMode("stage"); drawHome();
        var seen = false; try { seen = localStorage.getItem("dg-tut") === "1"; } catch (e) {}
        if (!seen) openTut();
      })();
    </script>
  </body>
</html>
