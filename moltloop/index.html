    const run=data.run;
    spec=R.pattern(stage(),Math.min(2,run.marks.length)); position=run.state==="miss"?run.stop:0;
    if(run.marks.length===3) position=spec.target+.5+run.marks[2]/1000;
    drag=0; currentBand=-1; lastPedal=""; board.invalidate(); hud(); requestFrame();
  }
  function demo() {
    return !running && !fx && !dialogs.length && stage()===0 && data.run.state==="play" && data.run.marks.length===0 && !reduceMotion.matches;
  }
  function paint(now) {
    board.draw({spec,position,colors:colorSet(),drag,demo:demo(),slow:data.run.slow,fx,time:now,t});
  }
  function requestFrame() {
    if(!frameId && !document.hidden) frameId=requestAnimationFrame(tick);
  }
  function advanceWind(now) {
    if(!running) return;
    const dt=R.clamp((now-lastTick)/1000,0,.35); lastTick=Math.max(now,lastTick);
    position=R.advance(position,dt,spec,data.run.slow,drag);
    const band=Math.floor(position);
    if(band!==currentBand && band<spec.count) {
      const index=spec.bands[band]; currentBand=band;
      tone(235+index*35,155+index*24,.055,"triangle",.032);
      if(band===spec.target) { tone(660,780,.09,"sine",.045); buzz(13); announce(t(latched?"tapNow":"release")); }
    }
    if(position>=spec.count) commitStop(now);
    else showPedal();
  }
  function tick(now) {
    frameId=0;
    if(document.hidden) return;
    if(running) advanceWind(now);
    if(fx && now/1000>=fx.start+fx.duration) settle();
    if(!dialogs.length && (!demo() || now-lastPaint>=30)) { paint(now); lastPaint=now; }
    if(running || fx || demo()) requestFrame();
  }
  function dropInput() {
    const held=pointer; pointer=null; keyHeld=false; latched=false; running=false; drag=0;
    if(held) {
      try { if(held.element.hasPointerCapture(held.id)) held.element.releasePointerCapture(held.id); } catch (_) {}
    }
  }
  function beginWind(now) {
    if(dialogs.length || busy || fx || running || data.run.state!=="play") return false;
    wakeAudio(); running=true; latched=false; drag=0; position=0; currentBand=-1; lastTick=now;
    tone(112,181,.072,"triangle",.045); buzz(7); showPedal(); requestFrame(); return true;
  }
  function commitStop(now) {
    if(!running) return;
    dropInput();
    const run=data.run, mark=R.markAt(position,spec);
    const kind=mark===null?"miss":R.perfect(mark)?"perfect":"good";
    run.stop=position; run.slow=false;
    if(mark===null) {
      run.state="miss"; tone(149,62,.16,"triangle",.085); buzz(34);
    } else {
      run.marks.push(mark); const pristine=R.perfect(mark);
      const root=pristine?587.33:493.88;
      tone(root,root*1.08,.095,"triangle",.07); tone(root*1.5,root*1.5,.17,"sine",.065,.048);
      if(pristine) tone(root*2,root*2,.18,"sine",.042,.09);
      buzz(pristine?22:13);
      if(run.marks.length===3) {
        run.state="clear"; data.coins+=R.payout(run.marks);
        const old=data.records[run.level];
        if(!old || R.score(run.marks)>R.score(old.marks)) data.records[run.level]={ink:run.ink,marks:run.marks.slice()};
        tone(1174.66,1174.66,.24,"sine",.052,.19);
      }
    }
    save();
    fx={kind,start:now/1000,duration:reduceMotion.matches ? .18 : (mark===null ? .30 : .52),position};
    hud(); announce(t(kind==="miss"?(position<spec.target?"early":"late"):kind)); requestFrame();
  }
  function stopWind() {
    if(!running) return;
    const now=performance.now(); advanceWind(now); if(running) commitStop(now);
  }
  function settle() {
    fx=null;
    if(data.run.state==="play") round();
    else { hud(); paint(performance.now()); rootDialog(data.run.state); }
  }
  function pauseInput() {
    if(running) { dropInput(); position=0; currentBand=-1; showPedal(); }
    if(fx) settle();
    paint(performance.now());
  }
  function startStage(level) {
    if(!canPlay(level)) return;
    dropInput(); fx=null; data.run=R.newRun(level,data.ink); save(); hideDialogs(); round();
  }
  function down(event) {
    if(!event.isPrimary || event.button!==0 || dialogs.length) return;
    event.preventDefault();
    if(running && latched) { stopWind(); return; }
    const now=performance.now(); if(!beginWind(now)) return;
    const element=event.currentTarget;
    pointer={id:event.pointerId,element}; touchStart=now; startX=event.clientX; startY=event.clientY; movement=0;
    try { element.setPointerCapture(event.pointerId); } catch (_) {}
  }
  function move(event) {
    if(!pointer || event.pointerId!==pointer.id) return;
    movement=Math.max(movement,Math.hypot(event.clientX-startX,event.clientY-startY));
    drag=R.clamp(Math.hypot(event.clientX-startX,event.clientY-startY)/145,0,1);
  }
  function up(event) {
    if(!pointer || event.pointerId!==pointer.id) return;
    event.preventDefault(); move(event);
    if(performance.now()-touchStart<=170 && movement<10) {
      pointer=null; latched=true; drag=0; showPedal(); requestFrame();
    } else stopWind();
  }
  function cancelled(event) {
    if(!pointer || event.pointerId!==pointer.id) return;
    pauseInput(); openPanel("pause");
  }
  for(const element of [$("board"),$("pedal")]) {
    element.addEventListener("pointerdown",down); element.addEventListener("pointermove",move);
    element.addEventListener("pointerup",up); element.addEventListener("pointercancel",cancelled);
    element.addEventListener("lostpointercapture",cancelled);
    element.addEventListener("contextmenu",e=>e.preventDefault());
  }
  $("pedal").addEventListener("click",event=>{
    if(event.detail!==0 || keyHeld) return;
    if(running&&latched) stopWind();
    else if(beginWind(performance.now())) { latched=true; showPedal(); }
  });
  function icon(name,cls="") { return '<canvas aria-hidden="true" class="'+cls+'" data-icon="'+name+'"></canvas>'; }
  const button=(act,key,glyph,style="",disabled=false)=>'<button class="action '+style+'" data-act="'+act+'"'+(disabled?" disabled":"")+'>'+icon(glyph)+t(key)+'</button>';
  const closeButton=()=>'<button class="icon-btn" data-act="close" aria-label="'+t("close")+'">'+icon("close")+'</button>';
  function head(title,subtitle,close=true) {
    return '<div class="sheet-head"><div><div class="kicker">'+subtitle+'</div><h2 id="dialog-title">'+title+'</h2></div>'+(close?closeButton():"")+'</div>';
  }
  const rewardLabel=()=>t(B.isAdFree()?"instant":B.isTest()?"testReward":"optReward");
  const rewardIcon=()=>B.isAdFree()?"spark":"video";
  const note=text=>'<small class="footnote">'+text+'</small>';
  const stageLabel=level=>t(R.chapters[chapterOf(level)])+' / '+t("reel")+' '+R.pad(level%6+1);
  const receipt=(marks,other,value)=>'<div class="receipt"><div><span>'+t("score")+'</span><b>'+R.score(marks)+'</b></div><div><span>'+other+'</span><b>'+value+'</b></div></div>';
  function mapHTML(view) {
    const ch=view.chapter, start=ch*6;
    const nav=(act,key,glyph,disabled)=>'<button class="icon-btn" data-act="'+act+'" aria-label="'+t(key)+'"'+(disabled?" disabled":"")+'>'+icon(glyph)+'</button>';
    let cards="";
    for(let id=start;id<start+6;id++) {
      const rec=data.records[id],allowed=canPlay(id);
      const labelText=t("reel")+" "+R.pad(id%6+1)+" · "+t(rec?"collected":allowed?"unlocked":"locked");
      cards+='<button aria-label="'+labelText+'" class="level '+(id===stage()?"current":"")+'" data-act="level" data-id="'+id+'"'+(allowed?"":" disabled")+'>'+
        (rec?'<canvas aria-hidden="true" data-thumb="'+id+'"></canvas>':icon(allowed?"play":"lock"))+'<b>'+R.pad(id%6+1)+'</b></button>';
    }
    const count=Object.keys(data.records).filter(id=>chapterOf(+id)===ch).length;
    return head(t("shelf"),t("archive"))+'<div class="map-heading">'+nav("prev","previous","prev",ch===0)+'<div><small>'+t("chapter",{n:R.pad(ch+1)})+'</small><h3>'+t(R.chapters[ch])+'</h3></div>'+nav("forward","forward","next",ch===3)+'</div>'+
      '<div class="level-grid">'+cards+'</div><small class="map-caption">'+t("count",{n:count})+'</small>'+
      (ch===3&&!B.ownsProduct("prism_pack")?button("offer-pack","unlock","lock","primary"):"");
  }
  function ownedInk(id) { return id===0 || (id===1?data.seaGlass:B.ownsProduct("ink_currant")); }
  function shopHTML() {
    let html=head(t("palette"),t("wallet")+" · "+data.coins);
    R.inks.forEach((set,id)=>{
      const owned=ownedInk(id), worn=data.ink===id;
      const word=worn?t("inUse"):owned?t("use"):id===1?icon("coin")+" 24":t("unlock");
      html+='<div class="product"><div class="swatches" aria-hidden="true">'+[0,2,3].map(n=>'<i style="background:'+set.colors[n]+'"></i>').join("")+'</div><div class="copy"><h3>'+t(set.name)+'</h3></div>'+
        '<button class="mini" data-act="ink" data-id="'+id+'"'+(worn?" disabled":"")+'>'+word+'</button></div>';
    });
    html+='<div class="group-label">'+t("extras")+'</div>';
    for(const [id,title,desc,act,glyph] of [["ad_free","adfree","adDesc","offer-ads","spark"],["prism_pack","prism","packDesc","offer-pack","grid"]]) {
      const owned=B.ownsProduct(id);
      html+='<div class="product">'+icon(glyph,"item-icon")+'<div class="copy"><h3>'+t(title)+'</h3><small>'+t(desc)+'</small></div><button class="mini" data-act="'+act+'"'+(owned?" disabled":"")+'>'+t(owned?"collected":"unlock")+'</button></div>';
    }
    return html+(B.isTest()?note(t("noCharge")):"");
  }
  function settingsHTML() {
    const row=(id,glyph)=>'<button class="setting" role="switch" aria-checked="'+data[id]+'" data-act="'+id+'"><span>'+icon(glyph)+t(id)+'</span><i class="switch '+(data[id]?"on":"")+'" aria-hidden="true"></i></button>';
    const options=L.languages.map((lang,i)=>'<option value="'+lang+'"'+(data.lang===lang?" selected":"")+'>'+L.names[i]+'</option>').join("");
    return head(t("settings"),"MOLTLOOP")+row("sound","sound")+row("vibration","vibration")+
      '<label class="setting"><span>'+icon("globe")+t("lang")+'</span><select id="language" aria-label="'+t("lang")+'">'+options+'</select></label>'+
      '<p>'+t("how")+'</p>'+note(t("altInput"));
  }
  function sheetHTML(view) {
    const run=data.run, kind=view.kind;
    if(kind==="settings") return settingsHTML();
    if(kind==="archive") return mapHTML(view);
    if(kind==="shop") return shopHTML();
    if(kind==="pause") return head(t("paused"),stageLabel(stage()))+
      '<div class="help-strip" aria-hidden="true">'+icon("hand")+'<i></i>'+icon("target")+'<i></i>'+icon("lift")+'</div><p>'+t("how")+'</p>'+
      button("resume","resume","play","primary")+button("slow",run.slow?"slowed":"assist",run.slow?"check":rewardIcon(),"bonus",run.slow)+
      (!run.slow?note(rewardLabel()):"");
    if(kind==="miss") {
      const early=run.stop<spec.target;
      return head(t(early?"early":"late"),stageLabel(stage()),false)+'<canvas id="slip-art" class="slip-art" aria-hidden="true"></canvas><p>'+t("slipHelp")+'</p>'+
        button("retry","restart","retry","primary")+
        (run.rewound?"":button("rewind","rewind",rewardIcon(),"bonus")+note(t("rewindHelp")+" · "+rewardLabel()));
    }
    if(kind==="clear" || kind==="print") {
      const live=kind==="clear",id=live?stage():view.id,rec=live?run:data.records[id];
      const reward=R.payout(rec.marks)*(live&&run.bonus?2:1);
      const count=rec.marks.filter(R.perfect).length;
      const html=head(t(live?"printed":"inspect"),t("proof",{n:R.pad(id+1)})+" · "+stageLabel(id),!live)+
        '<canvas id="result-art" class="result-art" aria-hidden="true"></canvas>'+
        receipt(rec.marks,live?t("wallet"):t("perfect").replace(/!|！/g,""),live?"+"+reward:count+" / 3");
      if(!live) return html+button("play-print","replay","play","primary")+button("share","share","share");
      const end=[17,23].includes(id);
      return html+button("next",end?"finale":"next",end?"grid":"arrow","primary")+
        '<div class="action-row">'+button("double",run.bonus?"doubled":"bonus",run.bonus?"check":rewardIcon(),"bonus",run.bonus)+button("share","share","share")+'</div>'+
        (!run.bonus?note(rewardLabel()):"");
    }
    if(kind==="end") {
      const encore=stage()>=18;
      return head(t(encore?"encoreEnd":"finished"),t("shelf"),false)+'<canvas id="folio-art" class="result-art" aria-hidden="true"></canvas><p>'+
        t(encore?"encoreText":"endText")+'</p>'+button("archive","archive","grid","primary")+button("retry","replay","retry");
    }
    const id=view.sku, name=id==="ad_free"?"adfree":id==="prism_pack"?"prism":"neonInk";
    const desc=id==="ad_free"?"adDesc":id==="prism_pack"?"packDesc":null;
    return head(t(name),t("extras"))+(desc?'<p>'+t(desc)+'</p>':"")+button("buy",B.isTest()?"testBuy":"buy","check","primary")+(B.isTest()?note(t("noCharge")):"");
  }
  function dialogArt() {
    const view=top(); if(!view) return;
    const run=data.run;
    if($("slip-art")) A.slipArt($("slip-art"),spec,run.ink,run.stop);
    if($("result-art")) {
      const rec=view.kind==="print"?data.records[view.id]:run;
      A.resultArt($("result-art"),view.kind==="print"?view.id:stage(),rec.marks,rec.ink);
    }
    if($("folio-art")) A.folio($("folio-art"),data.records,stage()>=18?18:0,stage()>=18?6:18);
    $("sheet").querySelectorAll("[data-thumb]").forEach(el=>A.thumb(el,+el.dataset.thumb,data.records[el.dataset.thumb]));
    A.iconsIn($("sheet"));
  }
  function renderSheet(focus=true) {
    const view=top(); if(!view) return;
    const sheet=$("sheet"), oldAct=document.activeElement?.dataset?.act;
    $("veil").hidden=false; $("machine").inert=true; $("machine").setAttribute("aria-hidden","true");
    sheet.innerHTML=sheetHTML(view); dialogArt();
    if(focus && view.kind==="clear" && !reduceMotion.matches) {
      const canvas=$("result-art"), run=data.run, start=performance.now();
      const impress=now=>{
        if(!canvas.isConnected || canvas!==$("result-art") || activeDialog()!=="clear") return;
        const progress=R.clamp((now-start)/420,0,1);
        A.resultArt(canvas,run.level,run.marks,run.ink,progress);
        if(progress<1) requestAnimationFrame(impress);
      };
      impress(start);
    }
    if(focus) { sheet.scrollTop=0; sheet.focus({preventScroll:true}); }
    else if(oldAct) sheet.querySelector('[data-act="'+oldAct+'"]:not(:disabled)')?.focus({preventScroll:true});
  }
  function hideDialogs() {
    dialogs.length=0; $("veil").hidden=true; $("machine").inert=false; $("machine").removeAttribute("aria-hidden");
    const back=previousFocus; previousFocus=null;
    if(back?.isConnected && back!==document.body) back.focus({preventScroll:true});
    requestFrame();
  }
  function rootDialog(kind) {
    dialogs.length=0; dialogs.push({kind}); renderSheet();
  }
  function openPanel(kind,extra={}) {
    if(busy) return;
    if(!dialogs.length) {
      previousFocus=document.activeElement; pauseInput();
      if(dialogs.length) return;
    }
    dialogs.push({kind,...extra}); renderSheet();
  }
  function closePanel() {
    if(busy || !dialogs.length || ["clear","miss","end"].includes(activeDialog())) return false;
    dialogs.pop();
    if(dialogs.length) renderSheet(); else hideDialogs();
    return true;
  }
  async function claim(placement,apply) {
    if(busy) return; busy=true; $("sheet").setAttribute("aria-busy","true");
    const run=data.run;
    try {
      const granted=await B.requestReward(placement);
      if(granted && data.run===run) apply(run);
      else if(!granted) toast("unavailable");
    } catch (_) { toast("unavailable"); }
    finally { busy=false; $("sheet").removeAttribute("aria-busy"); }
  }
  function equip(id) {
    data.ink=id;
    if(data.run.state==="play" || data.run.state==="miss") data.run.ink=id;
    save(); board.invalidate(); hud(); paint(performance.now()); renderSheet(false);
  }
  async function buy(sku) {
    if(busy) return; busy=true;
    let ok=false;
    try { ok=await B.purchaseProduct(sku); } catch (_) {}
    busy=false;
    if(!ok) { toast("purchaseError"); return; }
    closePanel();
    if(sku==="ink_currant") equip(2); else { hud(); renderSheet(false); }
  }
  async function share(view) {
    if(busy) return;
    busy=true;
    const level=view.kind==="print"?view.id:stage(),rec=view.kind==="print"?data.records[level]:data.run;
    try {
      const result=await B.shareResultPNG(A.shareCard(level,rec.marks,rec.ink,t));
      if(result==="downloaded") toast("saved");
    } catch (_) { toast("shareError"); }
    finally { busy=false; }
  }
  $("sheet").addEventListener("click",event=>{
    const element=event.target.closest("button[data-act]");
    if(!element || element.disabled || busy) return;
    const act=element.dataset.act, id=Number(element.dataset.id), view=top(), run=data.run;
    wakeAudio();
    switch(act) {
      case "close": case "resume": closePanel(); break;
      case "retry": startStage(stage()); break;
      case "archive": openPanel("archive",{chapter:chapterOf(stage())}); break;
      case "prev": case "forward": view.chapter=R.clamp(view.chapter+(act==="prev"?-1:1),0,3); renderSheet(false); break;
      case "level":
        if(!canPlay(id)) break;
        if(data.records[id]) openPanel("print",{id});
        else if(stage()===id && run.state==="play") hideDialogs();
        else startStage(id);
        break;
      case "play-print": startStage(view.id); break;
      case "next":
        if(run.state!=="clear") break;
        if([17,23].includes(stage())) { run.state="end"; save(); rootDialog("end"); }
        else startStage(stage()+1);
        break;
      case "rewind":
        if(run.state!=="miss" || run.rewound) break;
        claim("rewind",r=>{r.rewound=true;r.slow=true;r.state="play";r.stop=0;save();hideDialogs();round();}); break;
      case "slow":
        if(run.state!=="play" || run.slow) break;
        claim("slow",r=>{r.slow=true;save();hideDialogs();round();}); break;
      case "double":
        if(run.state!=="clear" || run.bonus) break;
        claim("double",r=>{if(r.bonus)return;r.bonus=true;data.coins+=R.payout(r.marks);save();hud();renderSheet(false);}); break;
      case "share": share(view); break;
      case "sound": case "vibration":
        data[act]=!data[act]; save(); if(act==="sound") {wakeAudio();tone(523,659,.12);} else buzz(14);
        renderSheet(false); break;
      case "ink":
        if(ownedInk(id)) equip(id);
        else if(id===1) {
          if(data.coins<24) toast("needInk",{n:24-data.coins});
          else { data.coins-=24; data.seaGlass=true; equip(id); }
        } else openPanel("offer",{sku:"ink_currant"});
        break;
      case "offer-pack": openPanel("offer",{sku:"prism_pack"}); break;
      case "offer-ads": openPanel("offer",{sku:"ad_free"}); break;
      case "buy": buy(view.sku); break;
    }
  });
  $("sheet").addEventListener("change",event=>{
    if(event.target.id!=="language" || !L.languages.includes(event.target.value)) return;
    data.lang=event.target.value; save(); board.invalidate(); hud(); paint(performance.now()); renderSheet(false);
    $("language")?.focus({preventScroll:true});
  });
  for(const [id,kind] of [["pause","pause"],["wallet","shop"],["archive","archive"],["inks","shop"],["settings","settings"]]) {
    $(id).addEventListener("click",()=>{wakeAudio();openPanel(kind,kind==="archive"?{chapter:chapterOf(stage())}:{});});
  }
  $("veil").addEventListener("click",event=>{ if(event.target===$("veil")) closePanel(); });
  function back() {
    if(busy) return true;
    if(dialogs.length) return closePanel();
    openPanel("pause"); return true;
  }
  window.MoltGameBack=()=>!busy && activeDialog()==="pause" && dialogs.length===1 ? false : back();
  document.addEventListener("keydown",event=>{
    if(event.key==="Escape") { event.preventDefault(); if(!event.repeat) back(); return; }
    if(dialogs.length) {
      if(event.key==="Tab") {
        const items=[...$("sheet").querySelectorAll("button:not(:disabled),select")];
        const first=items[0],last=items[items.length-1];
        if(event.shiftKey && (document.activeElement===first || document.activeElement===$("sheet"))) {event.preventDefault();last?.focus();}
        if(!event.shiftKey && document.activeElement===last) {event.preventDefault();first?.focus();}
      }
      return;
    }
    if(!["Space","Enter"].includes(event.code) || (event.target.closest("button") && event.target.closest("button")!==$("pedal"))) return;
    event.preventDefault(); if(event.repeat) return;
    if(running&&latched) stopWind();
    else if(beginWind(performance.now())) keyHeld=true;
  });
  document.addEventListener("keyup",event=>{
    if(keyHeld && ["Space","Enter"].includes(event.code)) { event.preventDefault(); stopWind(); }
  });
  function suspend() {
    if(running) { pauseInput(); if(!dialogs.length) openPanel("pause"); }
    else if(fx) settle();
    if(frameId) { cancelAnimationFrame(frameId); frameId=0; }
    save();
  }
  window.addEventListener("blur",suspend);
  window.addEventListener("focus",requestFrame);
  window.addEventListener("pagehide",suspend);
  document.addEventListener("visibilitychange",()=>{ if(document.hidden) suspend(); else requestFrame(); });
  function resized() {
    board.invalidate(); paint(performance.now()); A.iconsIn($("machine")); if(dialogs.length) dialogArt(); requestFrame();
  }
  round(); paint(performance.now()); A.iconsIn($("machine"));
  if(data.run.state!=="play") rootDialog(data.run.state);
  if(window.ResizeObserver) new ResizeObserver(resized).observe($("instrument"));
  else window.addEventListener("resize",resized);
})();

</script>
</body>
</html>
