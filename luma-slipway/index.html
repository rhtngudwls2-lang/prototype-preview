  <script>
/* Load before the game module. Optional native adapter methods return promises.
   Set window.StudioBridgeConfig = { production: true } before this script to
   disable all local demos, including in a browser or debug APK. */
(() => {
  'use strict';
  if (window.StudioBridge) return;

  const placements = new Set(['revive', 'hint', 'double']);
  const products = new Set(['adfree', 'skin-prism', 'stage-pack']);
  const storedKey = 'luma-slipway.demo-products.v1';
  let pending = false;
  const demoProducts = new Set();
  try {
    const values = JSON.parse(localStorage.getItem(storedKey) || '[]');
    if (Array.isArray(values)) for (const id of values) if (products.has(id)) demoProducts.add(id);
  } catch { /* Demo purchases still work for the current session. */ }

  function adapter() {
    if (window.StudioNative) return window.StudioNative;
    const cap = window.Capacitor;
    if (cap?.isPluginAvailable?.('StudioNative')) return cap.Plugins?.StudioNative;
    return null;
  }

  function nativeApp() {
    const cap = window.Capacitor;
    return Boolean(window.SlipwayBuild || cap?.isNativePlatform?.() ||
      ['android', 'ios'].includes(cap?.getPlatform?.()));
  }

  function mode() {
    if (adapter()) return 'native';
    if (window.StudioBridgeConfig?.production === true) return 'unavailable';
    if (!nativeApp()) return 'demo';
    try { if (window.SlipwayBuild?.isDebug?.() === true) return 'demo'; } catch { /* release fallback */ }
    return 'unavailable';
  }

  async function exclusive(action) {
    if (pending) return false;
    pending = true;
    try { return await action(); } catch { return false; } finally { pending = false; }
  }

  async function isAdFree() {
    if (mode() === 'demo') return demoProducts.has('adfree');
    try {
      const result = await adapter()?.isAdFree?.();
      return result === true || result?.adFree === true;
    } catch { return false; }
  }

  // Return null when the native billing client cannot supply an authoritative
  // snapshot (for example offline), preserving locally cached entitlements.
  async function getOwnedProducts() {
    if (mode() === 'demo') return [...demoProducts];
    try {
      const result = await adapter()?.getOwnedProducts?.();
      const ids = Array.isArray(result) ? result : result?.productIds;
      return Array.isArray(ids) ? ids.filter(id => products.has(id)) : null;
    } catch { return null; }
  }

  async function requestReward(placement = 'hint', callback) {
    if (typeof placement === 'function') {
      callback = placement;
      placement = 'hint';
    }
    const ok = placements.has(placement) && await exclusive(async () => {
      if (await isAdFree()) return true;
      if (mode() === 'demo') return true;
      const result = await adapter()?.requestReward?.({ placement });
      return result === true || result?.rewarded === true;
    });
    if (typeof callback === 'function') callback(ok);
    return ok;
  }

  async function purchase(productId) {
    if (!products.has(productId)) return false;
    return exclusive(async () => {
      if (mode() === 'demo') {
        demoProducts.add(productId);
        try { localStorage.setItem(storedKey, JSON.stringify([...demoProducts])); } catch { /* session only */ }
        return true;
      }
      const result = await adapter()?.purchase?.({ productId });
      return result === true || result?.purchased === true;
    });
  }

  async function shareResultPNG(canvas) {
    if (typeof canvas?.toBlob !== 'function') return false;
    try {
      const native = adapter();
      if (typeof native?.shareResultPNG === 'function') {
        const result = await native.shareResultPNG({ dataUrl: canvas.toDataURL('image/png') });
        return result === true || result?.shared === true;
      }
      if (typeof window.SlipwayBuild?.sharePng === 'function') {
        return window.SlipwayBuild.sharePng(canvas.toDataURL('image/png')) === true;
      }
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      if (!blob) return false;
      const file = typeof File === 'function' && new File([blob], 'luma-slipway.png', { type: 'image/png' });
      if (file && navigator.canShare?.({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Luma Slipway' });
        return true;
      }
      if (nativeApp()) return false;
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'luma-slipway.png';
      document.body.append(link);
      try { link.click(); } finally {
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
      }
      return true;
    } catch { return false; }
  }

  window.StudioBridge = Object.freeze({
    get mode() { return mode(); }, requestReward, isAdFree, getOwnedProducts, purchase, shareResultPNG
  });
})();

  <div class="shell">
    <header class="topline">
      <button class="signature" data-action="home" aria-label="Luma Slipway"><span class="logomark" aria-hidden="true"><b></b><b></b><b></b></span><span>LUMA<span class="lighttype">ARCADE</span></span></button>

        <button class="navbtn" data-action="workshop"><i data-icon="layers"></i><span data-text="workshop"></span></button>
      </nav>
      <div class="utilities">
        <span class="wallet" id="wallet" role="img"><i data-icon="coin"></i><b id="coins">0</b></span>
        <button class="iconbtn sound" data-action="sound" data-label="sound"><i id="sound-icon" data-icon="sound"></i></button>
        <button class="iconbtn" data-action="settings" data-label="settings"><i data-icon="settings"></i></button>
      </div>
    </header>
    <main class="cabinet">
      <section class="intro" aria-labelledby="title">
        <div class="eyebrow"><span class="signal"></span><span data-text="genre"></span></div>
        <h1 id="title">Luma<span>Slipway<span class="title-dot">.</span></span></h1>
        <p class="lead" data-text="concept"></p>
      </section>
      <section class="machine" id="machine" aria-label="3D">
        <div id="view-wrap">
          <canvas id="world" data-label="scene" role="img"></canvas>
          <div class="framehead"><div class="stage-tag"><span class="status-light"></span><span id="frame-status"></span><span id="lives" hidden></span></div><button class="glassbutton" data-action="help" data-label="help"><i data-icon="help"></i></button></div>
          <div class="reticle left"></div><div class="reticle right"></div>
          <div id="callout" role="status"></div><div id="webgl-error" hidden><span data-text="graphics"></span><button class="secondary" data-action="reload" data-text="retry"></button></div>
          <div class="liveband"><div class="scoreblock"><small data-text="score"></small><b id="score">0000</b></div><div class="queueblock"><small data-text="incoming"></small><div class="queue" id="queue"></div></div></div>
        </div>
        <div class="rotatebar">
          <button class="rotbtn" data-action="left" data-label="left"><i data-icon="rotateL"></i><kbd>←</kbd></button>
          <div class="rotate-label"><i data-icon="drag"></i><span data-text="rotate"></span></div>
          <button class="rotbtn" data-action="right" data-label="right"><kbd>→</kbd><i data-icon="rotateR"></i></button>
        </div>
      </section>
      <div class="controls">
        <div class="stagecard">
