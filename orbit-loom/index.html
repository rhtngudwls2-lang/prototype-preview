    run.hits = int(raw.hits, 0, spec.target, 0);

    for (const key of ['revived', 'guided', 'rewarded', 'doubled']) run[key] = raw[key] === true;

    const spec = levelSpec(run.level, run.mode);

    run.shots.push(run.aim);

    return { type: 'hit', ...result, perfect, points, aim: run.aim };
  }

    if (run.status !== 'lost' || run.revived) return false;
    run.revived = true;
    run.hearts = 2;

/* Replace the native adapter only. The game never loads an advertising SDK. */
(function () {
  'use strict';
  const DEMO_KEY = 'orbit-loom.demo-entitlements.v1';
  const pending = new Map();
  let entitlements = {};
  try { const saved = JSON.parse(localStorage.getItem(DEMO_KEY) || '{}'); if (saved && typeof saved === 'object' && !Array.isArray(saved)) entitlements = saved; } catch (_) { /* Storage may be unavailable. */ }
  let serial = 0;
  const native = () => window.OrbitNative;
  const demoEnabled = () => !window.ORBIT_CONFIG || window.ORBIT_CONFIG.demoMonetization !== false;
  const save = () => { try { localStorage.setItem(DEMO_KEY, JSON.stringify(entitlements)); } catch (_) {} };

  function nativeCall(method, payload) {
    return new Promise(resolve => {
      const id = 'loom-' + Date.now() + '-' + (++serial);
      const timer = setTimeout(() => { pending.delete(id); resolve({ granted: false, purchased: false, reason: 'timeout' }); }, 120000);
      pending.set(id, result => { clearTimeout(timer); resolve(result); });
      try { native()[method](id, JSON.stringify(payload)); }
      catch (_) { window.OrbitBridge.resolve(id, { granted: false, purchased: false, reason: 'unavailable' }); }
    });
  }

  function isAdFree() {
    try { if (native() && typeof native().isAdFree === 'function') return native().isAdFree() === true; } catch (_) {}
    return demoEnabled() && entitlements.ad_free === true;
  }

  async function requestReward(options = {}, callback) {
    if (typeof options === 'string') options = { placement: options };
    let result;
    if (isAdFree()) result = { granted: true, source: 'ad-free', transactionId: 'free-' + (++serial) };
    else if (native() && typeof native().requestReward === 'function') result = await nativeCall('requestReward', options);
    else if (demoEnabled()) result = { granted: true, source: 'web-demo', transactionId: 'demo-' + (++serial) };
    else result = { granted: false, reason: 'unavailable' };
    if (typeof callback === 'function') callback(result);
    return result;
  }

  async function requestPurchase(productId) {
    if (!['ad_free', 'prism_pack'].includes(productId)) return { purchased: false, reason: 'unknown-product' };
    if (native() && typeof native().requestPurchase === 'function') return nativeCall('requestPurchase', { productId });
    if (!demoEnabled()) return { purchased: false, reason: 'unavailable' };
    entitlements[productId] = true;
    save();
    return { purchased: true, productId, source: 'web-demo' };
  }

  async function restorePurchases() {
    if (native() && typeof native().restorePurchases === 'function') return nativeCall('restorePurchases', {});
    return { restored: demoEnabled(), entitlements: demoEnabled() ? { ...entitlements } : {} };
  }

  function hasProduct(id) {
    try { if (native() && typeof native().hasProduct === 'function') return native().hasProduct(id) === true; } catch (_) {}
    return demoEnabled() && entitlements[id] === true;
  }

  async function shareResultPNG(canvas) {
    try {
      if (window.OrbitPlatform && typeof window.OrbitPlatform.sharePNG === 'function') {
        window.OrbitPlatform.sharePNG(canvas.toDataURL('image/png').split(',')[1]);
        return { shared: true, method: 'native' };
      }
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      if (!blob) return { shared: false, reason: 'encode-failed' };
      const file = new File([blob], 'orbit-loom.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ title: 'ORBIT LOOM', files: [file] });
        return { shared: true, method: 'share' };
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      return { shared: true, method: 'download' };
    } catch (error) { return { shared: false, reason: error.name === 'AbortError' ? 'cancelled' : 'unavailable' }; }
  }

  window.OrbitBridge = Object.freeze({ resolve(id, raw) {
    const finish = pending.get(id);
    if (!finish) return;
    pending.delete(id);
    let value = raw;
    try { if (typeof raw === 'string') value = JSON.parse(raw); } catch (_) { value = {}; }
    finish(value && typeof value === 'object' ? value : {});
  } });
  window.GameBridge = Object.freeze({ requestReward, isAdFree, requestPurchase, restorePurchases, hasProduct, shareResultPNG,
    get mode() { return native() ? 'native' : demoEnabled() ? 'web-demo' : 'disabled'; }
  });
  window.requestReward = requestReward;
  window.isAdFree = isAdFree;
  window.shareResultPNG = shareResultPNG;
})();

      $('fire-button').disabled = run.status !== 'playing' || !!modalView || busy;
      if (now - lastSave > 2500 && run.status === 'playing' && !modalView) { persist(); lastSave = now; }
    }
    requestAnimationFrame(frame);
  }

  function modalHeader(title, subtitle = '') {
    return '<button class="icon-button modal-close" data-action="close" aria-label="' + t('close') + '">' + icon('close') + '</button><div class="kicker">ORBIT LOOM</div><h2 id="modal-title" class="modal-heading">' + title + '</h2>' + (subtitle ? '<p class="modal-sub">' + subtitle + '</p>' : '');
  }
  const demoNote = () => B.mode === 'web-demo' ? '<p class="demo-note">' + t('demoTag') + '</p>' : '';
  const rewardLabel = key => t(key) + (B.isAdFree() ? '' : ' · ▷');

  function openModal(view, origin) {
    if (busy) return;
    if (!modalView) { modalFocus = document.activeElement; pointer = null; persist(); }
    modalOrigin = origin || (modalView && !['win', 'lose'].includes(modalView) ? modalView : null);
    modalView = view;
    $('modal').hidden = false;
    renderModal();
    const first = $('modal-panel').querySelector('button:not(:disabled),select');
    if (first) first.focus({ preventScroll: true });
  }

  function closeModal(restoreResult = true) {
    if (busy) return;
    modalView = null; modalOrigin = null;
    $('modal').hidden = true;
    if (restoreResult && run.status !== 'playing' && endTimer <= 0) {
      openModal(run.status === 'won' ? 'win' : 'lose'); return;
    }
    if (modalFocus && modalFocus.isConnected) modalFocus.focus({ preventScroll: true });
  }

  function renderModal() {
    const panel = $('modal-panel');
    panel.className = 'modal-panel' + (['win', 'lose'].includes(modalView) ? ' result-panel' : '');
    let html = '';
    if (modalView === 'pause') {
      html = modalHeader(t('pause')) + '<div class="mini-guide">' + icon('moon') + '</div><div class="menu-stack">' +
        button('resume', t('resume'), '', 'play') + button('retry', t('retry'), 'secondary', 'retry') + button('map', t('map'), 'ghost', 'grid') + '</div>';
    } else if (modalView === 'settings') {
      html = modalHeader(t('settings')) +
        '<div class="setting-row"><span>' + icon('volume') + t('sound') + '</span><button data-action="sound" class="toggle ' + (data.sound ? 'on' : '') + '" aria-pressed="' + data.sound + '">' + t(data.sound ? 'on' : 'off') + '</button></div>' +
        '<div class="setting-row"><span>' + icon('vibrate') + t('haptics') + '</span><button data-action="haptics" class="toggle ' + (data.haptics ? 'on' : '') + '" aria-pressed="' + data.haptics + '">' + t(data.haptics ? 'on' : 'off') + '</button></div>' +
        '<label class="setting-row"><span>' + t('language') + '</span><select id="language-select"><option value="en"' + (data.lang === 'en' ? ' selected' : '') + '>English</option><option value="ko"' + (data.lang === 'ko' ? ' selected' : '') + '>한국어</option><option value="ja"' + (data.lang === 'ja' ? ' selected' : '') + '>日本語</option></select></label>' +
        '<p class="fine-print">' + t('audioNote') + '</p><p class="fine-print">' + t('privacy') + '</p>' + button('reset', t('reset'), 'ghost');
    } else if (modalView === 'reset') {
      html = modalHeader(t('resetAsk'), t('resetBody')) + button('cancel-reset', t('cancel'), 'secondary') + button('reset-confirm', t('resetConfirm'), 'danger');
    } else if (modalView === 'map') {
      html = modalHeader(t('collection'), t('collectionSub'));
      for (let chapter = 0; chapter < 5; chapter++) {
        html += '<section class="chapter-section"><h3 class="chapter-title">' + pad(chapter + 1) + ' / ' + t('chapters')[chapter] + '</h3><div class="stage-grid">';
        for (let i = chapter * 6 + 1; i <= chapter * 6 + 6; i++) {
          const locked = i > data.unlocked;
          html += '<button class="stage-cell' + (i === run.level && run.mode === 'campaign' ? ' current' : '') + '" data-level="' + i + '"' + (locked ? ' disabled' : '') + ' aria-label="' + t('stage') + ' ' + i + ', ' + (locked ? t('locked') : data.stars[i - 1] + ' ' + t('stars')) + '">' + (locked ? icon('lock') : pad(i)) + '<small>' + (locked ? '·' : '✦'.repeat(data.stars[i - 1]) || '·') + '</small></button>';
        }
        html += '</div></section>';
      }
      if (data.stars[29]) html += '<div class="map-endless">' + button('endless', '∞ &nbsp; ' + t('endless'), 'secondary') + '</div>';
    } else if (modalView === 'shop') {
      html = modalHeader(t('shop'), '✦ ' + data.coins.toLocaleString(data.lang) + ' ' + t('earned')) + '<div class="skin-grid">';
      palettes.forEach((p, i) => {
        const owned = p.premium ? B.hasProduct('prism_pack') : data.colors.includes(p.id);
        const active = p.id === palette.id;
        html += '<div class="skin-card' + (active ? ' active' : '') + '"><div class="swatch" style="--swatch:' + p.color + '">✧</div><div class="skin-info"><strong>' + t('colors')[i] + '</strong><small>' + (p.premium ? t('premium') : owned ? t('owned') : '✦ ' + p.price) + '</small></div><button data-skin="' + p.id + '"' + (active ? ' disabled' : '') + '>' + t(active ? 'selected' : owned ? 'use' : 'buy') + '</button></div>';
      });
      html += '</div>';
      for (const [product, title, body] of [['ad_free', 'instant', 'instantSub'], ['prism_pack', 'premium', 'premiumSub']]) {
        const owned = B.hasProduct(product);
        html += '<section class="product"><h3>' + t(title) + '</h3><p>' + t(body) + '</p><button class="button secondary" data-product="' + product + '"' + (owned ? ' disabled' : '') + '>' + t(owned ? 'owned' : B.mode === 'web-demo' ? 'purchase' : 'nativePurchase') + '</button></section>';
      }
      html += button('restore', t('restore'), 'ghost') + '<p class="fine-print">' + t('noForced') + '</p>' + demoNote();
    } else if (modalView === 'guide') {
      html = modalHeader(t('hint'), t('hintSub')) + '<div class="mini-guide">' + icon('guide') + '</div>' +
        button('reward-guide', rewardLabel('hint'), '', 'play') + '<p class="reward-note">' + t('rewardTag') + '</p>' + demoNote();
    } else if (modalView === 'win') {
      const finalLevel = run.mode === 'campaign' && run.level === 30;
      html = '<div class="kicker" style="text-align:center">' + (finalLevel ? t('campaignDone') : t('stage') + ' ' + pad(run.level) + ' / 30') + '</div><canvas class="result-art" id="result-art" width="360" height="360"></canvas>' +
        '<h2 id="modal-title" class="result-title">' + t(finalLevel ? 'finished' : 'complete') + '</h2><p class="result-sub">' + t(finalLevel ? 'finishedSub' : 'clearSub') + '</p>' +
        '<div class="rating" aria-label="' + E.stars(run) + ' / 3 ' + t('stars') + '">' + Array.from({ length: 3 }, (_, i) => '<span' + (i >= E.stars(run) ? ' class="dim"' : '') + '>✦</span>').join('') + '</div>' +
        '<div class="stat-row"><div class="stat"><small>' + t(wasRecord ? 'record' : 'score') + '</small><strong>' + run.score.toLocaleString(data.lang) + '</strong></div><div class="stat"><small>' + t('earned') + '</small><strong>+' + run.earned * (run.doubled ? 2 : 1) + '</strong></div></div>' +
        button(finalLevel ? 'endless' : 'next', t(finalLevel ? 'endless' : 'next')) +
        (!run.doubled ? button('reward-double', rewardLabel('double'), 'secondary', 'spark') : '') +
        button('share', t('share'), 'ghost', 'share') + button('map', t('leave'), 'ghost', 'grid') + demoNote();
    } else if (modalView === 'lose') {
      html = '<div class="mini-guide">' + icon('retry') + '</div><h2 id="modal-title" class="result-title">' + t(run.mode === 'endless' ? 'endlessLost' : 'lost') + '</h2><p class="result-sub">' + t('lostSub') + '</p>' +
        '<div class="stat-row"><div class="stat"><small>' + t(wasRecord ? 'record' : 'score') + '</small><strong>' + run.score.toLocaleString(data.lang) + '</strong></div><div class="stat"><small>' + t(run.mode === 'endless' ? 'wave' : 'stage') + '</small><strong>' + pad(run.level) + '</strong></div></div>' +
        button('retry', t('retry'), '', 'retry') + (!run.revived ? button('reward-revive', rewardLabel('revive'), 'secondary', 'heart') + '<p class="reward-note">' + t('reviveSub') + '</p>' : '') +
        button('share', t('share'), 'ghost', 'share') + button('map', t('leave'), 'ghost', 'grid') + demoNote();
    }
    panel.innerHTML = html;
    if ($('result-art')) {
      const art = $('result-art').getContext('2d');
      drawBloom(art, 180, 180, 142, E.levelSpec(run.level, run.mode).target, -Math.PI / 14, true);
    }
  }

  async function reward(placement) {
    if (busy) return;
    if (placement === 'revive' && (run.revived || run.status !== 'lost')) return;
    if (placement === 'double' && (run.doubled || run.status !== 'won')) return;
    if (placement === 'guide' && (run.guided || run.status !== 'playing')) return;
    const runId = run.id;
    busy = true; $('modal-panel').classList.add('busy');
    try {
      const result = await B.requestReward({ placement, runId, level: run.level });
      if (run.id !== runId) return;
      if (result.granted !== true) { toast(t('unavailable')); return; }
      if (placement === 'revive') { E.revive(run); endTimer = 0; }
      else if (placement === 'double' && !run.doubled) { data.coins += run.earned; run.doubled = true; }
      else if (placement === 'guide') { run.guided = true; guideRemaining = 3; run.aim = E.guideAngle(run); }
      persist(); updateHUD();
      if (result.source === 'web-demo') toast(t('demoReward'));
      busy = false;
      if (placement !== 'double') closeModal(false); else renderModal();
    } catch (_) { toast(t('unavailable')); }
    finally { busy = false; $('modal-panel').classList.remove('busy'); }
  }

  let selectedProduct = null;
  function showPurchase(product) {
    selectedProduct = product;
    modalView = 'purchase';
    $('modal-panel').innerHTML = modalHeader(t(product === 'ad_free' ? 'instant' : 'premium'), t(B.mode === 'web-demo' ? 'demoPurchaseBody' : 'confirmNativeBody')) +
      button('confirm-purchase', t(B.mode === 'web-demo' ? 'confirmDemo' : 'nativePurchase')) + button('shop', t('close'), 'ghost');
    $('modal-panel').scrollTop = 0;
  }

  async function purchase() {
    if (busy || !selectedProduct) return;
    busy = true; $('modal-panel').classList.add('busy');
    try {
      const result = await B.requestPurchase(selectedProduct);
      if (result.purchased === true) { toast(t(result.source === 'web-demo' ? 'purchased' : 'owned')); }
      else toast(t('unavailable'));
    } catch (_) { toast(t('unavailable')); }
    finally { busy = false; openModal('shop'); setPalette(); persist(); }
  }

  function shareCanvas() {
    const output = document.createElement('canvas'); output.width = 1080; output.height = 1350;
    const c = output.getContext('2d');
    const gradient = c.createLinearGradient(0, 0, 1080, 1350); gradient.addColorStop(0, '#173341'); gradient.addColorStop(1, '#07131d');
    c.fillStyle = gradient; c.fillRect(0, 0, 1080, 1350);
    c.strokeStyle = '#34515d'; c.lineWidth = 2; c.strokeRect(46, 46, 988, 1258);
    c.fillStyle = palette.color; c.font = '500 35px sans-serif'; c.textAlign = 'center'; c.fillText('O R B I T   L O O M', 540, 150);
    drawBloom(c, 540, 610, 330, Math.max(1, run.hits), -0.12, run.status === 'won');
    c.fillStyle = '#eef5f2'; c.font = '300 58px sans-serif';
    c.fillText(run.mode === 'endless' ? 'INFINITY / ' + pad(run.level) : 'CONSTELLATION / ' + pad(run.level), 540, 1060);
    c.fillStyle = palette.color; c.font = '500 41px sans-serif'; c.fillText(String(run.score).padStart(4, '0') + '  ✦  ' + '★'.repeat(run.status === 'won' ? E.stars(run) : 1), 540, 1150);
    c.fillStyle = '#94b0ba'; c.font = '26px sans-serif'; c.fillText('A LITTLE TIMING. A LITTLE MAGIC.', 540, 1240);
    return output;
  }

  async function action(name) {
    if (busy) return;
    unlockAudio();
    switch (name) {
      case 'close':
        if (modalView === 'purchase') { openModal('shop'); break; }
        closeModal(); break;
      case 'resume': closeModal(); break;
      case 'retry': newRun(run.mode === 'endless' ? 1 : run.level, run.mode); break;
      case 'next': if (run.status === 'won') newRun(Math.min(30, run.level + 1)); break;
      case 'endless': if (data.stars[29]) newRun(1, 'endless'); break;
      case 'map': case 'shop': case 'settings': openModal(name); break;
      case 'sound': data.sound = !data.sound; if (!data.sound && audioContext) audioContext.suspend(); else sound('click'); persist(); renderModal(); break;
      case 'haptics': data.haptics = !data.haptics; vibrate(20); persist(); renderModal(); break;
      case 'reward-guide': await reward('guide'); break;
      case 'reward-revive': await reward('revive'); break;
      case 'reward-double': await reward('double'); break;
      case 'confirm-purchase': await purchase(); break;
      case 'restore': {
        busy = true;
        try { const result = await B.restorePurchases(); toast(t(result.restored ? 'restored' : 'unavailable')); setPalette(); persist(); }
        catch (_) { toast(t('unavailable')); }
        finally { busy = false; renderModal(); }
        break;
      }
      case 'share': {
        busy = true;
        try { const result = await B.shareResultPNG(shareCanvas()); if (result.shared) toast(t(result.method === 'download' ? 'saved' : 'shared')); else if (result.reason !== 'cancelled') toast(t('unavailable')); }
        finally { busy = false; }
        break;
      }
      case 'reset': openModal('reset'); break;
      case 'cancel-reset': openModal('settings'); break;
      case 'reset-confirm': { const lang = data.lang; data = defaultSave(); data.lang = lang; setPalette(); newRun(1); break; }
    }
  }

  $('modal-panel').addEventListener('click', async event => {
    const el = event.target.closest('button');
    if (!el || el.disabled || busy) return;
    if (el.dataset.action) await action(el.dataset.action);
    else if (el.dataset.level) { const level = Number(el.dataset.level); if (level <= data.unlocked) newRun(level); }
    else if (el.dataset.product) showPurchase(el.dataset.product);
    else if (el.dataset.skin) {
      const skin = palettes.find(p => p.id === el.dataset.skin);
      if (!skin) return;
      if (skin.premium && !B.hasProduct('prism_pack')) { showPurchase('prism_pack'); return; }
      if (!skin.premium && !data.colors.includes(skin.id)) {
        if (data.coins < skin.price) { toast(t('needDust')); return; }
        data.coins -= skin.price; data.colors.push(skin.id);
      }
      data.skin = skin.id; setPalette(); persist(); updateHUD(); renderModal(); sound('hit');
    }
  });
  $('modal-panel').addEventListener('change', event => {
    if (event.target.id === 'language-select' && Object.hasOwn(LoomI18n, event.target.value)) {
      data.lang = event.target.value; localize(); persist(); renderModal();
    }
  });

  $('fire-button').addEventListener('click', shoot);
  $('pause-button').addEventListener('click', () => { sound('click'); openModal(run.status === 'playing' ? 'pause' : run.status === 'won' ? 'win' : 'lose'); });
  $('coins-button').addEventListener('click', () => { sound('click'); openModal('shop'); });
  $('guide-button').addEventListener('click', () => { sound('click'); if (canPlay() && !run.guided) openModal('guide'); });
  document.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', () => { sound('click'); openModal(el.dataset.open); }));

  function pointerAngle(event) {
    const rect = canvas.getBoundingClientRect();
    const x = event.clientX - rect.left - centerX, y = event.clientY - rect.top - centerY;
    if (Math.hypot(x, y) > 22 * scale) run.aim = Math.atan2(y, x);
  }
  canvas.addEventListener('pointerdown', event => {
    if (!canPlay() || pointer !== null || (event.pointerType === 'mouse' && event.button !== 0)) return;
    event.preventDefault(); unlockAudio(); pointer = event.pointerId;
    canvas.setPointerCapture(pointer); pointerAngle(event);
  });
  canvas.addEventListener('pointermove', event => {
    if (pointer === event.pointerId && canPlay()) { event.preventDefault(); pointerAngle(event); }
  });
  canvas.addEventListener('pointerup', event => {
    if (pointer !== event.pointerId) return;
    event.preventDefault(); pointerAngle(event); pointer = null; shoot();
  });
  canvas.addEventListener('pointercancel', () => { pointer = null; });
  canvas.addEventListener('lostpointercapture', () => { pointer = null; });
  canvas.addEventListener('contextmenu', event => event.preventDefault());

  document.addEventListener('keydown', event => {
    if (event.key === 'Tab' && modalView) {
      const focusables = Array.from($('modal-panel').querySelectorAll('button:not(:disabled),select'));
      const first = focusables[0], lastEl = focusables[focusables.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); lastEl?.focus(); }
      else if (!event.shiftKey && document.activeElement === lastEl) { event.preventDefault(); first?.focus(); }
      return;
    }
    if (event.key === 'Escape') { event.preventDefault(); if (modalView) closeModal(); else openModal('pause'); return; }
    if (!canPlay() || ['BUTTON', 'SELECT', 'INPUT'].includes(document.activeElement.tagName)) return;
    if (event.code === 'Space') { event.preventDefault(); if (!event.repeat) shoot(); }
    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') { event.preventDefault(); run.aim += event.key === 'ArrowLeft' ? -0.09 : 0.09; }
  });

  function pauseForBackground() {
    persist(); pointer = null;
    if (!modalView && run.status === 'playing') openModal('pause');
    if (audioContext && audioContext.state === 'running') audioContext.suspend().catch(() => {});
  }
  document.addEventListener('visibilitychange', () => { suspend = document.hidden; if (suspend) pauseForBackground(); last = 0; });
  window.addEventListener('pagehide', persist);
  window.addEventListener('blur', () => { if (!document.hidden && !busy) pauseForBackground(); });
  window.addEventListener('resize', resize);
  if (typeof ResizeObserver === 'function') new ResizeObserver(resize).observe(canvas);

  // Small native lifecycle surface; no debug controls or hidden wins in the game.
  window.OrbitApp = Object.freeze({ pause: pauseForBackground, back() { if (modalView) closeModal(); else openModal('pause'); } });
  setPalette(); localize(); resize();
  if (run.status === 'won') {
    finishWin(); persist();
    if (run.mode === 'endless') { run = E.nextWave(run); persist(); updateHUD(); }
    else openModal('win');
  } else if (run.status === 'lost') openModal('lose');
  if (!storageOK) toast(t('storage'));
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
