<body>
  <header class="header">
    <div class="head-inner">
      <button class="brand bare" data-action="play" aria-label="Glint Loom">
        <svg class="brand-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="11" fill="#cefa70"/><path d="m20.5 5 3.8 10.1 9.8 4.9-10 4.2-4.4 10.4-4.1-10.5L6 19.8l10.2-4.4z" fill="#152017"/><path d="m29.8 6.8 1 2.9 2.9 1-2.9 1-1 3-1.1-3-2.8-1 2.8-1z" fill="#152017"/></svg>
        <span>GLINT <i>LOOM</i></span>
      </button>
      <nav class="nav" aria-label="Navigation">
        <button data-action="play" data-page="play"><i data-icon="play"></i><span data-t="play"></span></button>
        <button data-action="stages" data-page="stages"><i data-icon="grid"></i><span data-t="stages"></span></button>
        <button data-action="vault" data-page="vault"><i data-icon="box"></i><span data-t="vault"></span></button>
      </nav>
      <div class="utility"><div class="bank" data-l="shards"><i data-icon="shard"></i><b id="bank">0</b></div><span class="utility-divider"></span><button class="icon-btn sound-btn" data-action="sound" data-l="sound"></button><button class="icon-btn" data-action="settings" data-l="settings"><i data-icon="settings"></i></button></div>
    </div>
  </header>
  <main>
    <section class="heading">
      <div><div class="eyebrow"><span class="sector-slashes" aria-hidden="true">///</span><span id="stage-kicker"></span></div><h1 id="stage-name"></h1></div>
      <button class="campaign-link" data-action="stages"><i data-icon="map"></i><span data-t="stageMap"></span><i data-icon="chevR"></i></button>
    </section>
    <div class="dashboard">
      <section class="machine" aria-label="3D">
        <div class="viewport" id="viewport">
          <canvas id="arena" tabindex="0" aria-label="3D"></canvas>
          <div class="glass-overlay" aria-hidden="true"></div>
          <div class="stage-hud">
            <div class="camera-label"><span class="live-dot"></span><span data-t="chamber"></span></div>
            <div class="mobile-timer"><i data-icon="clock"></i><b id="mobile-time"></b></div>
          </div>
          <button class="cam-pause" data-action="pause" data-l="pause"><i data-icon="pause"></i></button>
          <div class="gesture" id="gesture"><i data-icon="swipe"></i><span data-t="drag"></span></div>
          <div class="axis-lines" aria-hidden="true"><b></b><b></b><b></b></div>
          <div class="corner-mark" aria-hidden="true"></div>
          <div id="webgl-fail" hidden></div>
        </div>
        <div class="control-strip">
          <div class="control-label"><div class="control-icon"><i data-icon="rotate"></i></div><div><span class="micro" data-t="control"></span><strong data-t="rotate"></strong></div></div>
          <div class="step-controls"><button data-action="left" data-l="left"><i data-icon="arrowL"></i></button><button data-action="right" data-l="right"><i data-icon="arrowR"></i></button></div>
          <button class="mobile-hint" data-action="hint" data-l="hint"><i data-icon="spark"></i></button>
        </div>
      </section>
      <aside>
        <section class="panel time-panel"><div class="panel-title"><span class="panel-ico"><i data-icon="clock"></i></span><h2 data-t="time"></h2><span class="time-ornament" aria-hidden="true">•••</span></div><div class="timer-read"><b id="timer"></b><small>s</small></div><div class="meter"><span id="meter"></span></div></section>
        <section class="panel sequence-panel"><div class="panel-title"><span class="panel-ico"><i data-icon="layers"></i></span><h2 data-t="sequence"></h2><small class="count" id="ring-count">0 / 3</small></div><ol id="ring-list"></ol></section>
        <button class="hint-card" data-action="hint"><span class="hint-spark"><i data-icon="spark"></i></span><span><strong data-t="hint"></strong><small id="hint-sub"></small></span><i data-icon="chevR"></i></button>
      </aside>
    </div>
    <div class="mobile-progress" id="mobile-progress" aria-hidden="true"></div>
    <div class="foot-rail"><span class="instruction"><i data-icon="target"></i><span data-t="objective"></span></span><span class="key-legend"><kbd>←</kbd><kbd>→</kbd><span data-t="rotate"></span><kbd>Esc</kbd><span data-t="pause"></span></span></div>
  </main>
  <div id="scrim" class="scrim" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1"></section></div>
  <div id="toast" role="status"></div>
</body>
</html>
